<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Chai Yako</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>🍃 Welcome back</h1>
    <p class="subtitle">Log in to your farm dashboard.</p>
    <form method="POST">
      <div>
        <label>Email address</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;">Log in</button>
    </form>
    <div class="auth-foot">New here? <a href="{{ url_for('auth.register') }}">Create a farm account</a></div>
  </div>
</div>
</body>
</html>
