<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Chai Yako</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your farm account</h1>
    <p class="subtitle">Start recording your tea farm digitally — takes less than a minute.</p>
    <form method="POST">
      <div>
        <label>Full name</label>
        <input type="text" name="full_name" required placeholder="e.g. Kiplagat Rono">
      </div>
      <div>
        <label>Email address</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div>
        <label>Phone number</label>
        <input type="text" name="phone" placeholder="07XX XXX XXX">
      </div>
      <div>
        <label>Farm scale</label>
        <select name="scale">
          <option value="small">Small-scale farmer</option>
          <option value="large">Large-scale farmer</option>
        </select>
      </div>
      <div>
        <label>Farm number(s)</label>
        <input type="text" name="farm_numbers" required placeholder="e.g. KTDA-2231, PVT-004 (comma-separated if more than one)">
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" required minlength="6">
      </div>
      <div>
        <label>Confirm password</label>
        <input type="password" name="confirm_password" required minlength="6">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I have read and agree to the <a href="{{ url_for('main.terms') }}" target="_blank" rel="noopener">Terms &amp; Conditions</a></label>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;">Create account</button>
    </form>
    <div class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></div>
  </div>
</div>
</body>
</html>
