databases:
  - name: chai-yako-db
    plan: free
    databaseName: chaiyako
    user: chaiyako

services:
  - type: web
    name: chai-yako
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chai-yako-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
